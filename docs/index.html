<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bu Gece</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --accent: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, var(--bg));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: min(680px, 90vw);
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.15);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Bu Gece</div>
      <h1>İlgi odaları + gece planı</h1>
      <p>
        Bu site GitHub Pages için hazırlandı. Ana sayfa başarıyla yayınlanmak üzere
        <strong>/docs/index.html</strong> altında hazırlanmıştır.
      </p>
    </main>
  </body>
</html>
